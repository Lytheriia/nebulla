- type: entity
  parent: BaseAction
  id: ActionEatMouse
  name: Eat Mouse
  description: Eat the mouse in your hand, gaining nutriment and a hairball charge.
  components:
  - type: Sprite
    layers:
    - texture: /Textures/Nyanotrasen/Icons/verbiconfangs.png
      map: [ "enum.ActionVisuals.Icon" ]
  - type: InstantAction
    event: !type:EatMouseActionEvent

- type: entity
  parent: BaseAction
  id: ActionHairball
  name: Cough Up Hairball
  description: Purge some of your chemstream, and gain a cool hairball to throw at people.
  components:
  - type: Action
    useDelay: 30
  - type: Sprite
    sprite: Nyanotrasen/Objects/Specific/Species/felinid.rsi
    layers:
    - state: icon
      map: [ "enum.ActionVisuals.Icon" ]
  - type: InstantAction
    event: !type:HairballActionEvent
