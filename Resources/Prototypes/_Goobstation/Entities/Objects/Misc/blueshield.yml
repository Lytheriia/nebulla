# Blueshield
- type: entity
  parent: IDCardStandard
  id: BlueshieldIDCard
  name: blueshield officer ID card
  components:
  - type: Sprite
    layers:
    - state: centcom
    - state: idcentcom
  - type: Item
    heldPrefix:
  - type: PresetIdCard
    job: BlueshieldOfficer
  - type: Access
    tags:
    - CentralCommand
    - BlueshieldOfficer

- type: entity
  parent: BaseSubdermalImplant
  id: CommandTrackingImplant
  name: command tracking implant
  description: This implant reserved for command has a tracking device attached to a private suit sensor network, as well as a condition monitor for the Command radio channel.
  categories: [ HideSpawnMenu ]
  components:
  - type: SubdermalImplant
    whitelist:
      components:
      - MobState
  - type: SuitSensor
    randomMode: false
    controlsLocked: true
    commandTracker: true
    mode: SensorCords
    activationContainer: "implant"
  - type: DeviceNetwork
    deviceNetId: Wireless
    transmitFrequencyId: SuitSensor
  - type: StationLimitedNetwork
  - type: WirelessNetworkConnection
    range: 500

- type: entity
  id: CommandTrackingImplanter
  suffix: Command Tracker
  parent: BaseImplantOnlyImplanterCentcomm
  components:
  - type: Implanter
    implant: CommandTrackingImplant
