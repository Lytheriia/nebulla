- type: entity
  parent: [ BaseCartridge, BaseMajorContraband ]
  id: CartridgeHighCaliber
  name: cartridge (.50 anti-materiel)
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeHighCaliber
  - type: CartridgeAmmo
    proto: BulletHighCaliber
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi # Nebula edit
    layers:
    - state: base # Orion edit
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: base # Orion edit
  - type: StaticPrice
    price: 20

- type: entity
