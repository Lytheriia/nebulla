    proto: BulletHighCaliberExplosive
  - type: Sprite
    # Nebula start
    # layers:
    # - state: incendiary # Orion edit
    #   map: ["enum.AmmoVisualLayers.Base"]
    layers:
    - state: base
      map:
      - enum.AmmoVisualLayers.Base
    # Nebula end
    sprite: Objects/Weapons/Guns/Ammunition/Casings/large_casing.rsi # Nebula edit
  - type: SpentAmmoVisuals
