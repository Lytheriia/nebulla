- type: entity
  parent: ClothingHeadEnvirohelmCustomBase
  id: ClothingHeadEnvirohelmBlueshield
  name: blueshield's envirosuit helmet
  description: A Plasmaman envirosuit helmet designed for the blueshield.
  components:
  - type: Sprite
    layers:
    - state: icon
      color: "#535353"
    - state: accent-icon
      color: "#0044d4"
    - state: visor-icon
    - state: icon-flash
      visible: false
      shader: unshaded
      map: [ "light" ]
  - type: Item
    inhandVisuals:
      left:
      - state: inhand-left
        color: "#535353"
      - state: accent-inhand-left
        color: "#0044d4"
      - state: visor-inhand-left
      right:
      - state: inhand-right
        color: "#535353"
      - state: accent-inhand-right
        color: "#0044d4"
      - state: visor-inhand-right
  - type: Clothing
    clothingVisuals:
      head:
      - state: equipped-HELMET
        color: "#535353"
      - state: accent-equipped-HELMET
        color: "#0044d4"
      - state: visor-equipped-HELMET
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.3
        Slash: 0.3
        Piercing: 0.3
        Heat: 0.3
        Radiation: 0.75
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.75
