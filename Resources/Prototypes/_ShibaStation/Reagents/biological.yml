- type: reagent
  id: AriralBlood
  name: reagent-name-ariral-blood
  group: Biological
  desc: reagent-desc-ariral-blood
  flavor: metallic
  color: "#d82000"
  metamorphicMaxFillLevels: 5
  metamorphicFillBaseName: fill-
  metamorphicChangeColor: true
  recognizable: true
  physicalDesc: reagent-physical-desc-ferrous
  slipData:
    requiredSlipSpeed: 4.0
  friction: 0.4
  footstepSound:
    collection: FootstepBlood
    params:
      volume: 6
  metabolisms:
    Bloodstream:
      effects:
      - !type:AdjustReagent
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
        reagent: AriralBlood
        amount: -2
      - !type:Vomit
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
          inverted: true
        - !type:ReagentCondition
          reagent: AriralBlood
          min: 5
        probability: 0.1
      - !type:ModifyStatusEffect
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
          inverted: true
        - !type:ReagentCondition
          reagent: AriralBlood
          min: 2
        effectProto: StatusEffectSeeingRainbow
        type: Add
        time: 8
      - !type:PopupMessage
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
          inverted: true
        - !type:ReagentCondition
          reagent: AriralBlood
          min: 2
        type: Local
        visualType: Medium
        messages: [ "generic-reagent-effect-nauseous", "generic-reagent-effect-dizzy" ]
        probability: 0.5
      - !type:HealthChange
        conditions:
        - !type:MetabolizerTypeCondition
          type: [ Ariral ]
          inverted: true
        - !type:ReagentCondition
          reagent: AriralBlood
          min: 1
        damage:
          types:
            Poison: 1.25

