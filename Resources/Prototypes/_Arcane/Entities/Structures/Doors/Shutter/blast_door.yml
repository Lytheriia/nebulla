- type: entity
  parent: BlastDoor
  id: BlastDoorXeno
  name: exodermis blast door
  description: Don't lose an arm!
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/exo-blastdoor.rsi
    layers:
    - state: closed
      map: ["enum.DoorVisualLayers.Base"]
    - state: welded
      sprite: Structures/Doors/Airlocks/Effects/airlock-effects.rsi
      map: ["enum.WeldableLayers.BaseWelded"]
  - type: Door
    closeTimeOne: 0.4
    closeTimeTwo: 0.7
    openTimeOne: 0.4
    openTimeTwo: 0.7
    openingAnimationTime: 1.1
    closingAnimationTime: 1.0
    canPry: false
    crushDamage:
      types:
        Blunt: 25 # yowch

- type: entity
  parent: BlastDoorXeno
  id: BlastDoorXenoOpen
  suffix: Open
  components:
  - type: Door
    state: Open
  - type: Occluder
    enabled: false
  - type: Physics
    canCollide: false
  - type: Airtight
    airBlocked: false
  - type: RadiationBlocker
    enabled: false

- type: entity
  parent: BlastDoorFrame
  id: BlastDoorXenoFrame
  name: exodermis blast door frame
  description: Blast-retardant AND fire-retardant!
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Standard/exo-blastdoor.rsi
    state: assembly
