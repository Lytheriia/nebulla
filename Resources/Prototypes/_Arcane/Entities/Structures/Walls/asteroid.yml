- type: entity
  abstract: true
  parent: StructureHealthBarrierWeak
  id: BaseAsteroidDestructible
  components:
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 30
      behaviors:
      - &SoundStoneBreak !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6

