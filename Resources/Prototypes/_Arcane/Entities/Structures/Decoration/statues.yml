- type: entity
  abstract: true
  parent: [ BaseStructure, StructureHealthFurnitureStrong ]
  id: BaseStatue
  components:
  - type: Sprite
    drawdepth: Mobs
  - type: Damageable
    damageModifierSet: Rock
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg

- type: entity
  parent: BaseStatue
  id: StatueOrnateClown
  name: ornate savior statue
  description: A gilded statue. It portrays the return of the savior who will rise up and lead the clowns to the great honk.
  components:
  - type: Transform
    noRot: true
  - type: Sprite
    sprite: Structures/Decoration/statue-ornate-clown.rsi
    state: icon
    drawdepth: Mobs
    offset: "0.0,0.3125"
  - type: Construction
    graph: OrnateStatueClown
    node: ornateStatueClown
  - type: Damageable
    damageModifierSet: Metallic
  - type: SpriteFade
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.25,0.4,0.45"
        density: 60
        mask:
        - MachineMask
        layer:
        - MidImpassable
        - LowImpassable

# Ironsand Statues

- type: entity
  abstract: true
  parent: BaseStatue
  id: BaseIronsandStatue
  description: A mysterious statue found in a desert of iron sand.
  components:
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 80
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          SteelOre1:
            min: 1
            max: 2

- type: entity
  parent: BaseIronsandStatue
  id: StatueIronsandSmall
  name: ironsand small statue
  components:
  - type: Sprite
    sprite: Structures/Decoration/ironsand_statue.rsi
    state: small_pillar
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.25,0.25,0.25"
        density: 60
        mask:
        - MachineMask
        layer:
        - MachineLayer

