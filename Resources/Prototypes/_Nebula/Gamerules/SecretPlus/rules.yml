# Ported from Goob-Station: https://github.com/Goob-Station/Goob-Station

- type: entityTable
  id: SecretPlusTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: SpaceTrafficControlTable
      - !type:NestedSelector
        tableId: BasicGameRulesTable
      - !type:NestedSelector
        tableId: BasicAntagEventsTable
      - !type:NestedSelector
        tableId: ModerateAntagEventsTable

# extras to pick if primary didn't spend our chaos budget
# repeatedly rolled after the primary until we eat up all our chaos, if the primary wasn't enough
- type: weightedRandom
  id: SecretPlus
  weights:
    # subgamemodes
    Thief: 0.2
    Devil: 0.02
    ShadowlingRoundstart: 0.02
    # normal
    Traitor: 0.25
    ChangelingRuleRoundstart: 0.10
    HereticRoundstart: 0.11
    SpyRuleRoundstart: 0.05
    XenomorphsInfestationRoundstart: 0.02

# important note: those (and especially the above) weights aren't entirely accurate,
# as secret+ can randomly decide it's not going to use this gamerule
# if it doesn't entirely fit into its remaining budget,
# so if we rolled 450 budget and a rule takes 1000, we effectively rolled 900 (doubled for reroll consideration for primary gamerule only),
# which is not enough so we have a 10% chance to skip it
# however the amount of effective budget used is reduced for primary rule so this only matters on low/midpop
- type: weightedRandom
  id: SecretPlusPrimary
  weights:
    Traitor: 0.25
    ChangelingRuleRoundstart: 0.10
    HereticRoundstart: 0.11
    SpyRuleRoundstart: 0.05
    Nukeops: 0.05
    Revolutionary: 0.05
    Zombie: 0.04 # in search of how to make a rule always run alone? set loneRun in its secretPlusRule like zombies have
    BlobGameMode: 0.05
    Wizard: 0.025
    WraithRoundstart: 0.025
    CosmicCult: 0.05
    XenomorphsInfestationRoundstart: 0.02

# middle setting: supposed to be a "normal round" baseline setting
- type: entity
  id: SecretPlusMid
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    # if you've come here due to "too many antags", lower chaos change for less midrounds and lower starting chaos for less roundstarts
    minStartingChaos: 8 # scales per player
    maxStartingChaos: 16
    livingChaosChange: -0.018
    deadChaosChange: 0.020
    # chance for greenshift as well as evilshift
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.2
    # often fires chud events so relatively low
    eventIntervalMin: 120
    eventIntervalMax: 400
    # there's some misc variables in the comp if you want to try tweaking those
    scheduledGameRules: !type:NestedSelector
      tableId: SecretPlusTable

- type: entity
  id: SecretPlusHigh
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 11
    maxStartingChaos: 22
    livingChaosChange: -0.018
    deadChaosChange: 0.020
    chaosChangeVariationMin: 0.65
    chaosChangeVariationMax: 1.3
    eventIntervalMin: 90
    eventIntervalMax: 400

# greenshift setting
- type: entity
  id: SecretPlusLow
  parent: SecretPlusMid
  categories: [ HideSpawnMenu ]
  components:
  - type: SecretPlus
    minStartingChaos: 3
    maxStartingChaos: 6
    noRoundstartAntags: true
    livingChaosChange: -0.008
    deadChaosChange: 0.014
    chaosExponent: 1.2
    eventIntervalMin: 120
    eventIntervalMax: 450
