#Clockwork
- type: entity
  id: PinionAirlockAssembly
  name: airlock assembly
  suffix: Pinion, Clockwork
  parent: AirlockAssembly
  components:
  # Nebula start
  - type: Sprite
    sprite: _Arcane/Structures/Doors/Airlocks/Standard/brass-base.rsi
    state: "assembly"
  # Nebula end
  # Nebula start
  - type: Transform
    anchored: true
    noRot: true
  # Nebula end
  - type: Construction
    graph: PinionAirlock
    node: assembly
  placement:
    mode: SnapgridCenter

- type: entity
  parent: PinionAirlockAssembly
  id: PinionAirlockAssemblyGlass
  suffix: Pinion, Clockwork, Glass
  components:
  - type: Sprite
    sprite: Structures/Doors/Airlocks/Glass/clockwork_pinion.rsi
    state: "assembly"

