- type: entity
  id: Grille
  parent: BaseStructure
  name: grille
  description: A flimsy framework of iron rods.
  components:
  # <Trauma>
  - type: Penetratable # Goobstation - Better snipers
    penetrateDamage: 10
  # </Trauma>
  # Nebula start
  # - type: Transform # required
  #   noRot: true
  # Nebula end
  - type: MeleeSound
    soundGroups:
      Brute:
        path:
          "/Audio/Weapons/grille_hit.ogg"
  - type: RCDDeconstructable
    cost: 6
    delay: 4
    fx: EffectRCDDeconstruct4
  - type: CanBuildWindowOnTop
  # Nebula start
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/grille.rsi
    layers:
    - state: electrified
      sprite: Effects/electricity.rsi
      map: ["enum.ElectrifiedLayers.Sparks"]
      shader: unshaded
      visible: false
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: Structures/Walls/grille.rsi
    state: full
  # Nebula end
  # Nebula start
  - type: IconSmooth
    index: 0
    key: walls
    base: grille
  - type: PlacementReplacement
    key: grilles
  # Nebula end
  - type: Construction
    graph: Grille
    node: grille
    deconstructionTarget: start
  - type: Damageable
    damageModifierSet: PerforatedMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Electrified
    requirePower: true
    noWindowInTile: true
    highVoltageNode: high
    mediumVoltageNode: medium
    lowVoltageNode: low
  - type: NodeContainer
    nodes:
      high:
        !type:CableDeviceNode
        nodeGroupID: HVPower
      medium:
        !type:CableDeviceNode
        nodeGroupID: MVPower
      low:
        !type:CableDeviceNode
        nodeGroupID: Apc
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200 #excess damage (nuke?). avoid computational cost of spawning entities.
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
    - trigger:
        !type:DamageTrigger
        damage: 30 # Trauma - was 100, way too tanky (window has 50 hp lol)
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: grilleBroken
      - !type:DoActsBehavior
        acts: ["Breakage"]
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ElectrifiedVisuals.ShowSparks:
        enum.ElectrifiedLayers.Sparks:
          True: { visible: True }
          False: { visible: False }
  - type: AnimationPlayer

- type: entity
  id: ClockworkGrille
  parent: Grille
  name: clockwork grille
  description: A flimsy framework of iron rods assembled in traditional Ratvarian fashion.
  components:
  # Nebula start
  - type: Sprite
    sprite: _Arcane/Structures/Walls/brass-grille.rsi
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: _Arcane/Structures/Walls/brass-grille.rsi
    state: full
  # Nebula end
  - type: Construction
    graph: ClockGrille
    node: clockGrille
    deconstructionTarget: start

- type: entity
  id: GrilleBroken
  parent: BaseStructure
  name: grille
  description: A flimsy framework of iron rods. It has seen better days.
  components:
  # Nebula start
  - type: Sprite
    drawdepth: Walls
    sprite: Structures/Walls/grille.rsi
    state: broken
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: Structures/Walls/grille.rsi
    state: broken
  # Nebula end
  - type: RCDDeconstructable
    cost: 6
    delay: 4
    fx: EffectRCDDeconstruct4
  - type: Construction
    graph: Grille
    node: grilleBroken
    deconstructionTarget: start
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,-0.28125"
        density: 5
        mask:
        - DoorPassable
        layer:
        - DoorPassable
  - type: Physics
    bodyType: Static
    canCollide: false
  - type: Tag
    tags:
    - ForceNoFixRotations
  - type: Damageable
    damageModifierSet: FlimsyMetallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 10
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: start
      - !type:DoActsBehavior
        acts: ["Destruction"]

- type: entity
  id: ClockworkGrilleBroken
  parent: GrilleBroken
  name: clockwork grille
  description: A flimsy framework of iron rods assembled in traditional Ratvarian fashion. It has seen better days.
  components:
  # Nebula start
  - type: Sprite
    sprite: _Arcane/Structures/Walls/brass-grille.rsi
    state: broken
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: _Arcane/Structures/Walls/brass-grille.rsi
    state: broken
  # Nebula end
  - type: Construction
    graph: ClockGrille
    node: clockGrilleBroken

