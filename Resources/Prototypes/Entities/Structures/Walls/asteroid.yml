# Anyway
# See WallRock variants for the remappings.

- type: entity
  abstract: true # Nebula edit
  parent: BaseWall
  id: BaseAsteroidRock
  components:
  - type: Transform
    noRot: true
  # Nebula start
  - type: IconSmooth
    key: stone
    additionalKeys:
    - doors
    index: 0
    base: stone
  # Nebula end
  # Nebula start
  # - type: SmoothEdge
  # Nebula end
  # Nebula start
  - type: Icon
    state: full
  # Nebula end
  # Nebula start
  - type: Sprite
    drawdepth: Walls
  # Nebula end
  - type: MiningScannerViewable
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
        density: 2000

#Asteroid rock
- type: entity
  parent: [ BaseAsteroidRockVisuals, BaseAsteroidRock, BaseAsteroidDestructible ] # Nebula edit
  id: AsteroidRock
  name: asteroid rock
  description: A rocky asteroid.
  components:
  # <Trauma>
  - type: Gatherable
    toolWhitelist:
      tags: []
  # </Trauma>
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 120
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          path: /Audio/Effects/break_stone.ogg
          params:
            volume: -6
  # Nebula start
  - type: Damageable
    damageModifierSet: Rock
  # Nebula end

- type: entity
  abstract: true
  parent: BaseWall # Trauma, small gibtonite refractor
  id: BaseRockGibtonite
  suffix: Gibtonite
  components:
  # <Trauma>
  # Nebula start
  - type: Sprite
    layers:
    - state: gibtonite_inactive
      sprite: Structures/Walls/stone-ore.rsi
      visible: false
      map: [ "enum.MiningScannerVisualLayers.Overlay", "gib" ]
  # Nebula end
  # Nebula start
  # - type: Transform
  #   noRot: true
  # Nebula end
  - type: Damageable
    damageModifierSet: Rock
  - type: Injurable
    damageContainer: StructuralInorganic
  # Nebula start
  # - type: IconSmooth
  #   key: walls
  #   mode: NoSprite
  # Nebula end
  - type: MiningScannerViewable
  # Nebula start
  # - type: SmoothEdge
  # Nebula end
  # </Trauma>
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.Trigger.TriggerVisuals.VisualState:
        "gib":
          Primed:
            state: gibtonite_active
            shader: unshaded
            visible: true
          Unprimed:
            state: gibtonite_inactive
            visible: false
  - type: TimerTrigger
    examinable: false
    beepInterval: 0.4
    beepSound:
      collection: GlassCrack
  - type: RandomTimerTrigger
    min: 1 # Trauma, was 8
    max: 10
  - type: ExplodeOnTrigger
    keysIn:
    - timer
  - type: Explosive
    explosionType: DemolitionCharge
    totalIntensity: 450 # Nebula
    intensitySlope: 2.5
    maxIntensity: 10 # Nebula
    canCreateVacuum: false
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 3
      behaviors:
      - !type:TimerStartBehavior
      - !type:PlaySoundBehavior
        sound:
          collection: GlassBreak
    - trigger:
        !type:DamageTrigger
        damage: 500 # you have to really smack it for it to manually detonate. re-examine once defusal exists
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:TriggerBehavior
        keyOut: timer # explode immediately

