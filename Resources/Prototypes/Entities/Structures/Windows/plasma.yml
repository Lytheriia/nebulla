- type: entity
  id: PlasmaWindow
  name: plasma window
  parent: [BaseDeltaPressurePlasma, BaseWindowStructure, BaseRCDResistant]
  components:
  # Nebula start
  - type: Sprite
    sprite: Structures/Windows/window-plasma.rsi
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: Structures/Windows/window-plasma.rsi
    state: full
  # Nebula end
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    base: pwindow
  - type: Construction
    graph: Window
    node: plasmaWindow
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 3
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks.rsi
  - type: StaticPrice
    price: 100
  - type: RadiationBlocker
    resistance: 2.5 # Goobstation - Radiation Overhaul
  - type: Penetratable # Goobstation - Better snipers
    penetrateDamage: 75
    damagePenalty: 0.1
  - type: CosmicCorruptible # DeltaV - Cosmic Cult
    convertTo: WindowCosmicCult

- type: entity
  id: PlasmaWindowDirectional
  parent: [BaseDeltaPressurePlasmaQuarter, BaseWindowStructureDirectional, BaseRCDResistant]
  name: directional plasma window
  description: Don't smudge up the glass down there.
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: plasma_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: plasma_window
  - type: Construction
    graph: WindowDirectional
    node: plasmaWindowDirectional
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 20]
    damageDivisor: 1.5
    trackAllDamage: true
    damageOverlay:
      sprite: Structures/Windows/cracks_directional.rsi
  - type: Damageable
    damageModifierSet: Glass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 37
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassPlasma:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 50
  - type: RadiationBlocker
    resistance: 2.444 # Goobstation - Radiation Overhaul
  - type: Penetratable # Goobstation - Better snipers
    penetrateDamage: 50
    damagePenalty: 0.1

- type: entity
  parent: PlasmaWindow
  id: PlasmaWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  # Nebula start
  - type: Sprite
    drawdepth: WallTops
    sprite: Structures/Windows/window-diagonal-plasma.rsi
    state: state0
  # Nebula end
  - type: Tag
    tags:
    - Diagonal
    - Window
  # Nebula start
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: Structures/Windows/window-diagonal-plasma.rsi
    state: state0
  # Nebula end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  # Nebula start
  - type: DamageVisuals
    damageOverlay:
      sprite: Structures/Windows/cracks-diagonal.rsi
  # Nebula end
  - type: Construction
    graph: WindowDiagonal
    node: plasmaWindowDiagonal
