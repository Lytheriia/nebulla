- type: entity
  parent: Window # Nebula edit
  id: ClockworkWindow
  name: clockwork window
  description: Don't smudge up the brass down there.
  components:
  # <Trauma>
  - type: CosmicCorruptible
    convertTo: WindowCosmicCult
  # </Trauma>
  # Nebula start
  - type: Sprite
    sprite: _Arcane/Structures/Windows/window-brass.rsi
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: _Arcane/Structures/Windows/window-brass.rsi
    state: full
  # Nebula end
  - type: Repairable
    fuelCost: 10
    doAfterDelay: 2
  - type: Damageable
    damageModifierSet: RGlass
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 75
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassClockwork:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  # Nebula start
  - type: IconSmooth
    base: bwindow
  # Nebula end
  - type: Construction
    graph: Window
    node: clockworkWindow
  # Nebula start
  # - type: DamageVisuals
  #   damageDivisor: 3
  # Nebula end

- type: entity
  parent: WindowDirectional # Nebula edit
  id: WindowClockworkDirectional
  name: directional clockwork window
  description: Don't smudge up the brass down there.
  components:
  - type: Sprite
    sprite: Structures/Windows/directional.rsi
    state: clock_window
  - type: Icon
    sprite: Structures/Windows/directional.rsi
    state: clock_window
  - type: Construction
    graph: WindowDirectional
    node: windowClockworkDirectional
  # Nebula start
  # - type: DamageVisuals
  #   damageDivisor: 1.5
  # Nebula end
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Damageable
    damageModifierSet: RGlass
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 37
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: WindowShatter
      - !type:SpawnEntitiesBehavior
        spawn:
          ShardGlassClockwork:
            min: 1
            max: 2
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: StaticPrice
    price: 22.5

- type: entity
  parent: WindowDiagonal # Nebula edit
  id: ClockworkWindowDiagonal
  suffix: diagonal
  placement:
    mode: SnapgridCenter
    snap:
    - Window
  components:
  # Nebula start
  - type: Sprite
    sprite: _Arcane/Structures/Windows/window-diagonal-brass.rsi
  # Nebula end
  - type: Tag
    tags:
    - Diagonal
    - Window
  # Nebula start
  # - type: IconSmooth
  #   mode: Diagonal
  #   key: windows
  #   base: state
  # Nebula end
  # Nebula start
  - type: Icon
    sprite: _Arcane/Structures/Windows/window-diagonal-brass.rsi
    state: state0
  # Nebula end
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  # Nebula start
  # - type: DamageVisuals
  #   damageOverlay:
  #     sprite: Structures/Windows/cracks_diagonal.rsi
  # Nebula end
  - type: Construction
    graph: WindowDiagonal
    node: clockworkWindowDiagonal
