name: No submodule update checker

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    paths:
      - "RobustToolbox"

jobs:
  this_aint_right:
    name: Submodule update in pr found
    if: ${{ github.actor != vars.CHANGELOG_BOT && github.event.pull_request.draft == false && !startsWith(github.head_ref, 'upstream/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Fail
        run: exit 1
