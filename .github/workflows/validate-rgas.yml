name: RGA schema validator
on:
  push:
    branches: [master, staging, stable]
  merge_group:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

jobs:
  yaml-schema-validation:
    name: YAML RGA schema validator
    if: github.actor != vars.CHANGELOG_BOT && (github.event_name != 'pull_request' || github.event.pull_request.draft == false)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.0
      - name: Setup Submodule
        run: git submodule update --init
      - name: Pull engine updates
        uses: Trauma-Station/submodule-dependency@v0.2.2
        with:
          map: |
            {
              "QuietToolbox": "RobustToolbox"
            }
      - uses: PaulRitter/yaml-schema-validator@v1
        with:
          schema: .github/Schemas/rga.yml
          path_pattern: .*attributions.ya?ml$
          validators_path: RobustToolbox/Schemas/rga_validators.py
          validators_requirements: .github/Schemas/rga_requirements.txt
